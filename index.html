  <style>
    :root {
      --navy: #0b1736;
      --navy2: #14275f;
      --blue: #2563eb;
      --blue2: #3b82f6;
      --cyan: #22d3ee;
      --soft: #eff6ff;
      --text: #172033;
      --muted: #667085;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --green: #047857;
      --red: #b91c1c;
      --shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* HEADER */

    header {
      position: relative;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(34, 211, 238, 0.18),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(59, 130, 246, 0.25),
          transparent 30%
        ),
        linear-gradient(135deg, var(--navy), var(--navy2));

      padding: 26px 20px 70px;
    }

    .topbar {
      position: relative;
      z-index: 2;
      max-width: 1120px;
      margin: 0 auto 55px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff;
      text-decoration: none;

      font-size: 21px;
      font-weight: 900;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background: linear-gradient(145deg, #fff, #dff8ff);

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
    }

    .hero {
      position: relative;
      z-index: 2;

      max-width: 820px;
      margin: auto;

      text-align: center;
    }

    .badge {
      display: inline-block;

      padding: 7px 12px;
      margin-bottom: 16px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);

      color: #dffaff;

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.02;
      letter-spacing: -2px;

      margin-bottom: 16px;
    }

    h1 .accent {
      color: var(--cyan);
    }

    .hero p {
      max-width: 650px;
      margin: auto;

      color: #d8e3ff;
      font-size: 18px;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;

      margin-top: 28px;

      flex-wrap: wrap;
    }

    .hero-btn {
      display: inline-block;

      padding: 13px 20px;

      border-radius: 11px;

      text-decoration: none;

      font-weight: 800;
      font-size: 14px;
    }

    .primary {
      background: #fff;
      color: var(--navy);
    }

    .secondary {
      border: 1px solid rgba(255, 255, 255, 0.22);

      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero-btn:hover {
      transform: translateY(-1px);
    }

    /* NAVIGATION */

    nav {
      position: sticky;
      top: 0;
      z-index: 30;

      background: rgba(255, 255, 255, 0.96);

      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);

      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    .nav-inner {
      max-width: 1120px;
      margin: auto;

      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding: 10px 16px;

      scrollbar-width: thin;
    }

    nav a {
      white-space: nowrap;

      text-decoration: none;

      color: #475467;

      font-size: 13px;
      font-weight: 800;

      padding: 9px 12px;

      border-radius: 9px;
    }

    nav a:hover {
      background: var(--soft);
      color: var(--blue);
    }

    /* MAIN */

    main {
      max-width: 1120px;
      margin: auto;

      padding: 42px 16px 70px;
    }

    .section-title {
      font-size: 28px;
      letter-spacing: -0.7px;

      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);

      margin-bottom: 24px;
    }

    /* POPULAR */

    .popular {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 16px;

      margin-bottom: 48px;
    }

    .popular-card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 22px;

      text-decoration: none;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .popular-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(15, 23, 42, 0.09);
    }

    .icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background: var(--soft);

      font-size: 22px;

      margin-bottom: 13px;
    }

    .popular-card h3 {
      font-size: 17px;

      margin-bottom: 5px;
    }

    .popular-card p {
      font-size: 13px;
      color: var(--muted);
    }

    /* CALCULATORS */

    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 20px;
    }

    .card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 24px;

      box-shadow: var(--shadow);
    }

    .card.full {
      grid-column: 1 / -1;
    }

    .card-head {
      display: flex;
      gap: 13px;
      align-items: flex-start;

      margin-bottom: 20px;
    }

    .card-icon {
      font-size: 26px;
      line-height: 1;
    }

    .card h2 {
      font-size: 21px;
      line-height: 1.2;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);

      margin-top: 4px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 14px;
    }

    .field {
      min-width: 0;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 800;

      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d0d5dd;
      border-radius: 10px;

      background: #fff;
      color: var(--text);

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .field.full {
      grid-column: 1 / -1;
    }

    button {
      width: 100%;

      margin-top: 15px;

      padding: 13px;

      border: 0;
      border-radius: 10px;

      background: var(--blue);
      color: #fff;

      font-weight: 800;
      font-size: 15px;

      cursor: pointer;

      transition: background 0.2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    /* RESULT */

    .result {
      display: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 11px;

      background: var(--soft);

      border-left: 4px solid var(--blue);

      font-weight: 700;
    }

    .result.show {
      display: block;
    }

    .result.error {
      background: #fef2f2;
      border-left-color: var(--red);
      color: var(--red);
    }

    .result.success {
      background: #ecfdf5;
      border-left-color: var(--green);
    }

    .result small {
      display: block;

      color: var(--muted);

      font-weight: 500;

      margin-top: 3px;
    }

    /* ADS */

    .ad {
      min-height: 90px;

      margin: 28px 0;

      border: 1px dashed #cbd5e1;
      border-radius: 14px;

      background: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #94a3b8;

      font-size: 12px;

      text-align: center;
    }

    /* NOTICE */

    .notice {
      font-size: 12px;
      color: var(--muted);

      margin-top: 10px;
    }

    /* FOOTER */

    footer {
      background: var(--navy);

      color: #cbd5e1;

      text-align: center;

      padding: 30px 16px;
    }

    footer strong {
      color: #fff;
    }

    footer a {
      color: #cbd5e1;

      text-decoration: none;

      margin: 0 7px;
    }

    footer a:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      header {
        padding: 22px 16px 55px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .hero p {
        font-size: 16px;
      }

      .popular,
      .tools {
        grid-template-columns: 1fr;
      }

      .card.full {
        grid-column: auto;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .section-title {
        font-size: 25px;
      }

      main {
        padding-top: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
